      ax += sx * 180;
      ay += sy * 180;
    }
  }

  const n = Math.hypot(ax, ay);
  if (n > 1e-6) {
    input.aimX = ax / n;
    input.aimY = ay / n;
  }
}

function update(dt) {
  if (toastT > 0) {
    toastT -= dt;
    if (toastT <= 0) elToast.classList.remove('show');
  }
  if (state === 'feast') {
    updateComedyWin(dt);
    return;
  }
  if (state === 'devour') {
    updateComedyDeath(dt);
    return;
  }
  if (state !== 'play') {
    for (const p of particles) { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; p.vy *= 0.98; }
    particles = particles.filter(p => p.life > 0);
    return;
  }

  if (hitStop > 0) { hitStop -= dt; return; }
  time += dt;
  // No clear time limit — win by clearing all balls only.
  // timeLeft kept for debug/compat but never counts down or fails the run.
  timeLeft = Infinity;
  if (player.invuln > 0) player.invuln -= dt;
  if (shake > 0) shake = Math.max(0, shake - dt * 3);

  runAutoWinBot();
  applyPlayerInput(dt);
  integrateBall(player, dt, true);
  player.face = player.boostT > 0 ? 'yeet' : (player.pushEffort > 0.55 ? 'push' : 'focus');

  for (const b of balls) {
    aiStep(b, dt);
    integrateBall(b, dt, false);
    b.face = Math.hypot(b.vx, b.vy) > 120 ? 'grin' : 'neutral';
  }

  if (player.bounceCD > 0) player.bounceCD -= dt;
  for (const b of balls) {
    if (b.bounceCD > 0) b.bounceCD -= dt;
  }

  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    const res = resolvePlayerBall(b);
    if (res === 'eat') {
      queueEatVisual(b); // visual snapshot only; collision and growth still resolve immediately
      const eatenR = b.r;
      const beforeR = playerRadius();
      const dR = growByVolume(player, eatenR, ABSORB_RATIO);
      eatFX(b.x, b.y, eatenR, '#6a4a28');
      playEatSFX(eatenR, beforeR);
      const gain = Math.max(1, Math.round(dR));
      popTexts.push({
        x: b.x, y: b.y - b.r - 6,
        text: '+' + gain + ' 体积',
        life: 0.85, max: 0.85,
      });
      showToast(pickEatLine(), 0.65);
      balls.splice(i, 1);
      kills++;
      updateHUD();
      try { navigator.vibrate && navigator.vibrate(10); } catch (_) {}
      if (balls.length === 0) {
        updateHUD();
        winGame();
        return;
      }
    } else if (res === 'die') {
      // RECORDING ONLY: when __clearAssist, treat would-be death as bounce/separate
      // so a clear-all victory tape is reachable. Defaults leave this off (hard die).
      if (window.__clearAssist || player.invuln > 0 || (player.bounceCD || 0) > 0) {
        const sep = separateCircles(player, b, 5);
        if ((player.bounceCD || 0) <= 0) {
          bouncePlayerOff(b, sep.nx, sep.ny, 0.3);
        } else {
          const hx = Math.cos(player.heading), hy = Math.sin(player.heading);
          if (hx * sep.nx + hy * sep.ny < 0.25) {
            player.heading = Math.atan2(sep.ny, sep.nx);
            input.aimX = sep.nx; input.aimY = sep.ny;
            const s = cruiseSpeed();
            player.vx = sep.nx * s; player.vy = sep.ny * s;
          }
        }
        continue;
      }
      // suck-into-belly cinematic, then dead overlay
      startDevour(b, '眼没看清，撞上大家伙了。');
      return;
    }
  }

  // Bias look slightly north (ahead of constant-speed push) and clamp so the canvas
  // is filled with arena, not a south-wall brown dead band that steals mouse aim.
  const sc = viewScale();
  const viewW = vw / Math.max(1e-6, sc);
  const viewH = vh / Math.max(1e-6, sc);
  let tx = player.x;
  let ty = player.y - Math.min(120, viewH * 0.12);
  const pad = 24;
  const minCx = ARENA.x + viewW * 0.5 - pad;
  const maxCx = ARENA.x + ARENA.w - viewW * 0.5 + pad;
  const minCy = ARENA.y + viewH * 0.5 - pad;
  const maxCy = ARENA.y + ARENA.h - viewH * 0.5 + pad;
  if (minCx <= maxCx) tx = clamp(tx, minCx, maxCx);
  else tx = ARENA.x + ARENA.w * 0.5;
  if (minCy <= maxCy) ty = clamp(ty, minCy, maxCy);
  else ty = ARENA.y + ARENA.h * 0.5;
  cam.x += (tx - cam.x) * Math.min(1, 4.5 * dt);
  cam.y += (ty - cam.y) * Math.min(1, 4.5 * dt);
  let wantZ = player.r > 40 ? 0.92 : 1;
  // boost: no FOV/zoom punch — keep cam.z size-based only
  cam.z += (wantZ - cam.z) * Math.min(1, 2 * dt);

  for (const p of particles) {
    p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt;
    p.vx *= 0.96; p.vy *= 0.96;
    if (p.suck) {
      const dx = player.x - p.x, dy = player.y - p.y;
      const dn = Math.hypot(dx, dy) || 1;
      p.vx += (dx / dn) * 420 * dt;
      p.vy += (dy / dn) * 420 * dt;
    }
  }
  particles = particles.filter(p => p.life > 0);
  if (particles.length > 48) particles.splice(0, particles.length - 48);
  for (const m of marks) m.life -= dt;
  marks = marks.filter(m => m.life > 0);
  for (const er of eatRings) er.life -= dt;
  eatRings = eatRings.filter(er => er.life > 0);
  for (const t of popTexts) { t.life -= dt; t.y -= 34 * dt; }
  popTexts = popTexts.filter(t => t.life > 0);

  if (player.pushEffort > 0.45 && Math.random() < dt * 8) {
    const ang = player.beetleAng;
    dust.push({
      x: player.x + Math.cos(ang) * (player.r + 8),
      y: player.y + Math.sin(ang) * (player.r + 8),
      r: 3 + Math.random() * 5, a: 0.4, life: 0.4,
      vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40,
    });
  }
  // continuous boost trail (visual only)
  if (player.boostT > 0) {
    const back = player.heading + Math.PI;
    const nDust = Math.max(1, (dt * 90) | 0);
    for (let i = 0; i < nDust; i++) {
      const spr = (Math.random() - 0.5) * 0.9;
      dust.push({
        x: player.x + Math.cos(back + spr) * player.r * (0.5 + Math.random() * 0.7),
        y: player.y + Math.sin(back + spr) * player.r * (0.5 + Math.random() * 0.7),
        r: 6 + Math.random() * 14, a: 0.7, life: 0.3 + Math.random() * 0.28,
        vx: Math.cos(back + spr) * (80 + Math.random() * 140) + (Math.random() - 0.5) * 70,
        vy: Math.sin(back + spr) * (80 + Math.random() * 140) + (Math.random() - 0.5) * 70,
      });
    }
    if (Math.random() < dt * 22) {
      boostGhosts.push({
        x: player.x, y: player.y, r: player.r * (0.92 + Math.random() * 0.1),
        heading: player.heading, life: 0.26, max: 0.26,
      });
    }
  }
  for (const g of boostGhosts) g.life -= dt;
  boostGhosts = boostGhosts.filter(g => g.life > 0);
  if (boostGhosts.length > 10) boostGhosts.splice(0, boostGhosts.length - 10);
  for (const d of dust) { d.life -= dt; d.x += d.vx * dt; d.y += d.vy * dt; d.a *= 0.96; }
  dust = dust.filter(d => d.life > 0);
  if (dust.length > 64) dust.splice(0, dust.length - 64);

  if (((time * 8) | 0) !== (((time - dt) * 8) | 0) || balls.length === 0) updateHUD();
}

function pickEatLine() {
  const lines = ['吞下', '体积上来了', '再滚', '这颗归我', '清场中', '差点反吃'];
  return lines[(Math.random() * lines.length) | 0];
}

function worldTransform() {
  const scale = viewScale();
  // Never translate the whole view for juice (no screen shake / trauma shift).
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.translate(vw / 2, vh / 2);
  ctx.scale(scale, scale);
  ctx.translate(-cam.x, -cam.y);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function drawBackground() {
  ctx.drawImage(texDirt, -100, -100, W + 200, H + 200);
  ctx.save();
  roundRect(ARENA.x, ARENA.y, ARENA.w, ARENA.h, 28);
  ctx.strokeStyle = 'rgba(60,42,24,0.85)';
  ctx.lineWidth = 14;
  ctx.stroke();
  ctx.strokeStyle = 'rgba(160,120,70,0.35)';
  ctx.lineWidth = 2.5;
  roundRect(ARENA.x + 5, ARENA.y + 5, ARENA.w - 10, ARENA.h - 10, 24);
  ctx.stroke();
  ctx.restore();
  const mMax = Math.min(marks.length, 14);
  for (let i = marks.length - mMax; i < marks.length; i++) {
    const m = marks[i];
    ctx.globalAlpha = 0.4 * (m.life / 2.2);
    ctx.drawImage(texWet, m.x - m.r, m.y - m.r * 0.55, m.r * 2, m.r * 1.1);
  }
  ctx.globalAlpha = 1;
}

const _palCache = new Map();
function dungPalette(seed) {
  let pal = _palCache.get(seed);
  if (pal) return pal;
  const rng = mulberry32(seed);
  const hueShift = rng() * 14 - 4;
  const base = [
    68 + hueShift + rng() * 14,
    42 + hueShift * 0.5 + rng() * 9,
    22 + rng() * 7
  ];
  // Stronger value range so offset-radial spheres read at a glance (Agar-style)
  pal = {
    base,
    dark: [base[0] * 0.16, base[1] * 0.14, base[2] * 0.11],
    mid: [base[0] * 0.55, base[1] * 0.52, base[2] * 0.45],
    light: [Math.min(175, base[0] + 52), Math.min(130, base[1] + 38), Math.min(78, base[2] + 24)],
    wet: [Math.min(150, base[0] + 36), Math.min(108, base[1] + 26), Math.min(62, base[2] + 16)],
    sss: [Math.min(200, base[0] + 70), Math.min(130, base[1] + 28), Math.min(70, base[2] + 8)],
    hi: [Math.min(235, base[0] + 110), Math.min(210, base[1] + 100), Math.min(160, base[2] + 70)],
  };
  _palCache.set(seed, pal);
  return pal;
}

function rgb(c, a) {
  if (a == null) return `rgb(${c[0]|0},${c[1]|0},${c[2]|0})`;
  return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
}

function drawDungBall(b, lod) {
  if (lod == null) lod = b === player ? 2 : (b.r >= 26 ? 1 : 0);
  const seedN = b.seed || 1;
  const picked = pickDungAtlas(seedN, b.r);
  if (!picked) {
    drawDungBallProcedural(b, lod);
    return;
  }

  const { x, y, r, roll } = b;
  const sq = b.squeeze || 0;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale((b.stretch || 1) * (1 + sq * 0.06), (b.squash || 1) * (1 - sq * 0.08));

  // 1) Soft elliptical ground shadow
  ctx.beginPath();
  ctx.ellipse(r * 0.06, r * 0.82, r * 0.92, r * 0.30, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fill();

  // 2–4) Clip circle → photo texture (rotated by roll) → matte sphere lighting
  ctx.save();
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.clip();

  ctx.save();
  ctx.rotate(roll || 0);
  const tw = r * 2.2;
  ctx.drawImage(picked.atlas, -tw / 2, -tw / 2, tw, tw);
  ctx.restore();

  // Soft lighting pass ON TOP of photo (matte fibrous dung — not glossy marble)
  // Upper-left lighten + lower-right darken via offset radial
  const hx = -r * 0.30, hy = -r * 0.36;
  const shade = ctx.createRadialGradient(hx, hy, r * 0.06, r * 0.20, r * 0.26, r * 1.08);
  shade.addColorStop(0, 'rgba(255,242,210,0.20)');
  shade.addColorStop(0.28, 'rgba(255,230,190,0.07)');
  shade.addColorStop(0.55, 'rgba(0,0,0,0)');
  shade.addColorStop(0.82, 'rgba(0,0,0,0.18)');
  shade.addColorStop(1, lod >= 2 ? 'rgba(0,0,0,0.42)' : 'rgba(0,0,0,0.34)');
  ctx.fillStyle = shade;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Rim AO
  const ao = ctx.createRadialGradient(hx * 0.4, hy * 0.4, r * 0.45, 0, 0, r);
  ao.addColorStop(0, 'rgba(0,0,0,0)');
  ao.addColorStop(0.62, 'rgba(0,0,0,0)');
  ao.addColorStop(0.85, 'rgba(0,0,0,0.10)');
  ao.addColorStop(1, lod >= 2 ? 'rgba(0,0,0,0.36)' : 'rgba(0,0,0,0.28)');
  ctx.fillStyle = ao;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // VERY soft matte sheen; tiny wet sheen only on crop-02 (idx 1)
  if (lod >= 1) {
    const sx = -r * 0.26, sy = -r * 0.32;
    const wet = picked.idx === 1;
    const spec = ctx.createRadialGradient(sx, sy, 0, sx, sy, r * (wet ? 0.30 : 0.34));
    if (wet) {
      spec.addColorStop(0, 'rgba(255,248,230,0.26)');
      spec.addColorStop(0.40, 'rgba(230,200,150,0.10)');
      spec.addColorStop(1, 'rgba(200,160,90,0)');
    } else {
      spec.addColorStop(0, 'rgba(255,245,220,0.11)');
      spec.addColorStop(0.45, 'rgba(220,190,140,0.045)');
      spec.addColorStop(1, 'rgba(200,160,90,0)');
    }
    ctx.beginPath();
    ctx.ellipse(sx, sy, r * (wet ? 0.28 : 0.30), r * (wet ? 0.18 : 0.20), -0.4, 0, Math.PI * 2);
    ctx.fillStyle = spec;
    ctx.fill();
  }
  ctx.restore(); // end clip

  // Rim + player warm outline/halo
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  if (b === player) {
    ctx.strokeStyle = 'rgba(8,5,2,0.95)';
    ctx.lineWidth = Math.max(2.8, r * 0.09);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.03, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(236,205,120,0.85)';
    ctx.lineWidth = Math.max(2.0, r * 0.06);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.12, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,165,90,0.35)';
    ctx.lineWidth = Math.max(1.6, r * 0.04);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,175,100,0.16)';
    ctx.lineWidth = Math.max(2.5, r * 0.08);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(20,10,4,0.75)';
    ctx.lineWidth = Math.max(1.1, r * 0.038);
    ctx.stroke();
  }
  ctx.restore();
}


function drawDungBallProcedural(b, lod) {
  if (lod == null) lod = b === player ? 2 : (b.r >= 26 ? 1 : 0);
  const { x, y, r, roll, seed } = b;
  const pal = dungPalette(seed || 1);
  const sq = b.squeeze || 0;
  const seedN = seed || 1;

  ctx.save();
  ctx.translate(x, y);
  ctx.scale((b.stretch || 1) * (1 + sq * 0.06), (b.squash || 1) * (1 - sq * 0.08));

  // 1) Soft elliptical ground shadow (Agar-style)
  ctx.beginPath();
  ctx.ellipse(r * 0.06, r * 0.82, r * 0.92, r * 0.30, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.40)';
  ctx.fill();

  // Perfect circle body path (mild ≤3% jitter only on large LOD for dung character)
  const useJitter = lod >= 2 && r >= 28;
  const bumps = useJitter ? 24 : 0;
  function ballPath() {
    ctx.beginPath();
    if (!useJitter) {
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      return;
    }
    for (let i = 0; i <= bumps; i++) {
      const a = (i / bumps) * Math.PI * 2;
      const jitter = 1 + Math.sin(a * 2.5 + (seedN % 9)) * 0.025 + Math.sin(a * 4 + seedN * 0.01) * 0.012;
      const px = Math.cos(a) * r * jitter, py = Math.sin(a) * r * jitter;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  // 2) Offset radial: light upper-left → base → mid → dark lower-right rim
  const hx = -r * 0.35, hy = -r * 0.40;
  ballPath();
  const g = ctx.createRadialGradient(hx, hy, r * 0.08, r * 0.18, r * 0.22, r * 1.05);
  g.addColorStop(0, rgb(pal.light));
  g.addColorStop(0.28, rgb(pal.base));
  g.addColorStop(0.62, rgb(pal.mid));
  g.addColorStop(1, rgb(pal.dark));
  ctx.fillStyle = g;
  ctx.fill();

  // Texture / mottles / roll seams UNDER lighting (clip to ball)
  if (lod >= 1) {
    ctx.save();
    ballPath();
    ctx.clip();
    ctx.rotate(roll);
    const mottles = lod >= 2 ? 6 : 3;
    for (let i = 0; i < mottles; i++) {
      const a = ((seedN * (i + 3)) % 628) / 100;
      const d = r * (0.15 + ((seedN >> (i % 8)) & 7) * 0.06);
      const sr = r * (0.18 + (i % 3) * 0.07);
      ctx.beginPath();
      ctx.ellipse(Math.cos(a) * d, Math.sin(a) * d, sr, sr * 0.6, a, 0, Math.PI * 2);
      ctx.fillStyle = i & 1 ? 'rgba(18,10,4,0.18)' : 'rgba(150,110,55,0.10)';
      ctx.fill();
    }
    ctx.strokeStyle = 'rgba(25,14,6,0.28)';
    ctx.lineWidth = Math.max(1.0, r * 0.05);
    ctx.lineCap = 'round';
    for (let i = 0; i < (lod >= 2 ? 4 : 2); i++) {
      const y0 = -r * 0.4 + i * r * 0.28;
      ctx.beginPath();
      ctx.moveTo(-r * 0.7, y0);
      ctx.quadraticCurveTo(0, y0 + r * 0.06, r * 0.65, y0);
      ctx.stroke();
    }
    if (lod >= 2 && r >= 22 && texDungNoise) {
      ctx.globalAlpha = 0.18;
      ctx.globalCompositeOperation = 'multiply';
      const tw = r * 2.4;
      ctx.drawImage(texDungNoise, -tw / 2, -tw / 2, tw, tw);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  } else {
    // lod0: single soft roll seam for motion read
    ctx.save();
    ctx.rotate(roll);
    ctx.strokeStyle = 'rgba(25,14,6,0.28)';
    ctx.lineWidth = Math.max(1, r * 0.055);
    ctx.beginPath();
    ctx.arc(0, 0, r * 0.55, -0.8, 0.8);
    ctx.stroke();
    ctx.restore();
  }

  // 3) Soft AO ring near rim (darken edge) — clip so it stays on ball
  ctx.save();
  ballPath();
  ctx.clip();
  const ao = ctx.createRadialGradient(hx * 0.55, hy * 0.55, r * 0.35, 0, 0, r);
  ao.addColorStop(0, 'rgba(0,0,0,0)');
  ao.addColorStop(0.55, 'rgba(0,0,0,0)');
  ao.addColorStop(0.82, 'rgba(0,0,0,0.12)');
  ao.addColorStop(1, lod >= 2 ? 'rgba(0,0,0,0.42)' : 'rgba(0,0,0,0.34)');
  ctx.fillStyle = ao;
  ctx.beginPath();
  ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fill();

  // Soft secondary diffuse oval (warm, under specular)
  ctx.beginPath();
  ctx.ellipse(-r * 0.22, -r * 0.28, r * 0.38, r * 0.26, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = lod >= 2 ? 'rgba(210,170,100,0.16)' : 'rgba(190,145,80,0.12)';
  ctx.fill();

  // 4) Specular AFTER texture — sharp cream highlight + tiny bright core
  const sx = -r * 0.32, sy = -r * 0.38;
  const sr = r * (lod === 0 ? 0.20 : 0.22);
  const spec = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
  spec.addColorStop(0, 'rgba(255,248,230,0.78)');
  spec.addColorStop(0.35, 'rgba(255,235,190,0.38)');
  spec.addColorStop(0.7, 'rgba(230,190,120,0.10)');
  spec.addColorStop(1, 'rgba(200,160,90,0)');
  ctx.beginPath();
  ctx.ellipse(sx, sy, sr, sr * 0.72, -0.45, 0, Math.PI * 2);
  ctx.fillStyle = spec;
  ctx.fill();
  // tiny bright core
  ctx.beginPath();
  ctx.ellipse(sx - r * 0.02, sy - r * 0.02, r * 0.07, r * 0.05, -0.4, 0, Math.PI * 2);
  ctx.fillStyle = lod >= 1 ? 'rgba(255,252,245,0.72)' : 'rgba(255,252,245,0.55)';
  ctx.fill();

  if (lod >= 2) {
    // secondary soft specular (lower alpha)
    const s2x = -r * 0.08, s2y = -r * 0.18;
    const s2 = ctx.createRadialGradient(s2x, s2y, 0, s2x, s2y, r * 0.28);
    s2.addColorStop(0, 'rgba(255,230,180,0.18)');
    s2.addColorStop(1, 'rgba(255,220,160,0)');
    ctx.beginPath();
    ctx.ellipse(s2x, s2y, r * 0.28, r * 0.16, 0.3, 0, Math.PI * 2);
    ctx.fillStyle = s2;
    ctx.fill();
  }
  ctx.restore(); // end clip

  // Rim stroke + player identity outline (after specular so it stays readable)
  ballPath();
  if (b === player) {
    ctx.strokeStyle = 'rgba(8,5,2,0.95)';
    ctx.lineWidth = Math.max(2.8, r * 0.09);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.03, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(236,205,120,0.85)';
    ctx.lineWidth = Math.max(2.0, r * 0.06);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.12, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,165,90,0.35)';
    ctx.lineWidth = Math.max(1.6, r * 0.04);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.22, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(210,175,100,0.16)';
    ctx.lineWidth = Math.max(2.5, r * 0.08);
    ctx.stroke();
  } else {
    ctx.strokeStyle = 'rgba(20,10,4,0.75)';
    ctx.lineWidth = Math.max(1.1, r * 0.038);
    ctx.stroke();
  }
  ctx.restore();
}


function drawBeetle(px, py, pr, ang, effort, squeeze, simple, animationTime) {
  if (simple && pr < 18) {
    const dist = pr + 12;
    const bx = px + Math.cos(ang) * dist;
    const by = py + Math.sin(ang) * dist;
    const sc = Math.max(0.55, pr / 22);
    ctx.save();
    ctx.translate(bx, by);
    ctx.rotate(ang + Math.PI / 2);
    ctx.scale(sc, sc);
    ctx.beginPath();
    ctx.ellipse(0, 4, 7, 9, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#1a2410';
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(0, -5, 5, 4, 0, 0, Math.PI * 2);
    ctx.fillStyle = '#243018';
    ctx.fill();
    ctx.strokeStyle = '#12180c';
    ctx.lineWidth = 1.8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-4, -7); ctx.lineTo(-6, -12);
    ctx.moveTo(4, -7); ctx.lineTo(6, -12);
    ctx.stroke();
    ctx.restore();
    return;
  }
  const press = (squeeze || 0) * 0.55 + effort * 0.35;
  const dist = pr + (simple ? 15 : 20) - press * (simple ? 5 : 9) + (1 - effort) * 4;
  const bx = px + Math.cos(ang) * dist;
  const by = py + Math.sin(ang) * dist;
  const scale = simple
    ? Math.max(0.7, Math.min(1.35, pr / 28))
    : Math.max(1.25, Math.min(2.0, pr / 18));
  const lean = 0.22 + effort * 0.28 + (squeeze || 0) * 0.18;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(ang + Math.PI / 2);
  ctx.rotate(-lean * 0.4);
  ctx.scale(scale * (1 + (squeeze || 0) * 0.05), scale * (1 - (squeeze || 0) * 0.1));

  // ground contact shadow
  ctx.beginPath();
  ctx.ellipse(0, simple ? 11 : 15, simple ? 10 : 14, simple ? 3.2 : 5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();

  const gait = (animationTime == null ? time : animationTime) * (9 + effort * 14);

  // --- legs (draw under body) ---
  function leg(side, ly, len, swingPhase, front) {
    const swing = Math.sin(gait + swingPhase) * (front ? 2.5 + effort * 3 : 4.5 + effort * 5);
    const reach = front ? (-16 - effort * 7 - (squeeze || 0) * 5) : (6 + Math.abs(swing) * 0.4);
    ctx.strokeStyle = '#1a140c';
    ctx.lineWidth = simple ? 2 : 2.8;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    // femur
    const jx = side * (front ? 5 : 7);
    const jy = ly;
    const mx = side * (front ? 8 + effort * 2 : 14);
    const my = front ? reach * 0.4 + swing * 0.3 : ly + swing * 0.35;
    const tx = side * (front ? (3 + swing * 0.25) : (18 + Math.abs(swing) * 0.4));
    const ty = front ? reach : ly + 5 + swing;
    ctx.beginPath();
    ctx.moveTo(jx, jy);
    ctx.lineTo(mx, my);
    ctx.lineTo(tx, ty);
    ctx.stroke();
    // claw
    if (!simple) {
      ctx.fillStyle = '#0e0a06';
      ctx.beginPath();
      ctx.arc(tx, ty, front ? 2.0 : 1.6, 0, Math.PI * 2);
      ctx.fill();
      if (front) {
        // contact spark / dirt when pushing hard
        if (effort > 0.7) {
          ctx.fillStyle = `rgba(90,70,40,${0.3 * effort})`;
          ctx.beginPath();
          ctx.arc(tx, ty - 2, 3, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }
  }

  // front pair braced into ball
  leg(-1, -3, 1, 0, true);
  leg(1, -3, 1, Math.PI, true);
  // mid
  leg(-1, 4, 1, 1.2, false);
  leg(1, 4, 1, 1.2 + Math.PI, false);
  // hind
  leg(-1, 11, 1, 2.4, false);
  leg(1, 11, 1, 2.4 + Math.PI, false);

  // --- abdomen / elytra (metallic dark bronze) ---
  const elyH = (simple ? 12 : 15) - effort * 1.2;
  const ely = ctx.createLinearGradient(-10, 0, 12, 18);
  ely.addColorStop(0, '#3a4a28');
  ely.addColorStop(0.25, '#243018');
  ely.addColorStop(0.55, '#182010');
  ely.addColorStop(0.8, '#101408');
  ely.addColorStop(1, '#0a0c06');
  ctx.beginPath();
  ctx.ellipse(0, 7, simple ? 8 : 11.5, elyH, 0, 0, Math.PI * 2);
  ctx.fillStyle = ely;
  ctx.fill();

  // carapace seam
  ctx.beginPath();
  ctx.moveTo(0, -1);
  ctx.lineTo(0, 7 + elyH - 1);
  ctx.strokeStyle = 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // iridescent specular on elytra
  ctx.beginPath();
  ctx.ellipse(-4.5, 2, simple ? 3 : 4.5, simple ? 5 : 7, -0.25, 0, Math.PI * 2);
  const ir = ctx.createRadialGradient(-5, 0, 0, -4, 3, 8);
  ir.addColorStop(0, 'rgba(180,200,90,0.5)');
  ir.addColorStop(0.35, 'rgba(90,120,50,0.22)');
  ir.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = ir;
  ctx.fill();
  // cool secondary sheen
  ctx.beginPath();
  ctx.ellipse(5, 8, 3, 5, 0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(40,70,90,0.12)';
  ctx.fill();

  ctx.strokeStyle = 'rgba(8,12,4,0.7)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.ellipse(0, 7, simple ? 8 : 11.5, elyH, 0, 0, Math.PI * 2);
  ctx.stroke();

  // --- thorax ---
  const th = ctx.createRadialGradient(-2, -10, 1, 0, -8, 10);
  th.addColorStop(0, '#2e3820');
  th.addColorStop(0.5, '#1a2214');
  th.addColorStop(1, '#0e1208');
  ctx.beginPath();
  ctx.ellipse(0, -8, simple ? 6.5 : 8.5, simple ? 6 : 7, 0, 0, Math.PI * 2);
  ctx.fillStyle = th;
  ctx.fill();
  ctx.strokeStyle = 'rgba(8,12,4,0.6)';
  ctx.lineWidth = 1;
  ctx.stroke();
  // thorax highlight
  ctx.beginPath();
  ctx.ellipse(-2.5, -10, 2.5, 2, -0.3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(100,130,70,0.25)';
  ctx.fill();

  // --- head ---
  ctx.beginPath();
  ctx.ellipse(0, -15, simple ? 4.5 : 5.5, simple ? 3.8 : 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#12180c';
  ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  // horns (scarab) — dark keratin
  if (!simple || pr > 12) {
    ctx.strokeStyle = '#0a0804';
    ctx.lineWidth = simple ? 1.8 : 2.4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-3.5, -17);
    ctx.quadraticCurveTo(-10, -22, -7, -27);
    ctx.moveTo(3.5, -17);
    ctx.quadraticCurveTo(10, -22, 7, -27);
    ctx.moveTo(0, -17);
    ctx.lineTo(0, -25);
    ctx.stroke();
    ctx.fillStyle = '#0a0804';
    ctx.beginPath(); ctx.arc(-7, -27, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, -27, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -25, 1.7, 0, Math.PI * 2); ctx.fill();
  }

  // compound eyes — small dark, slight wet glint (NOT cute big eyes)
  ctx.fillStyle = '#1a0804';
  ctx.beginPath(); ctx.ellipse(-3.2, -15, 1.8, 1.4, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3.2, -15, 1.8, 1.4, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(200,180,100,0.35)';
  ctx.beginPath(); ctx.arc(-3.5, -15.4, 0.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.9, -15.4, 0.5, 0, Math.PI * 2); ctx.fill();

  // push force read: strain lines + dust when boosting
  if (!simple && effort > 0.8) {
    ctx.strokeStyle = `rgba(200,170,100,${0.25 * effort})`;
    ctx.lineWidth = 1.2;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 5, -24);
      ctx.lineTo(i * 7, -34 - effort * 3);
      ctx.stroke();
    }
  }

  ctx.restore();
}

function drawDeathPellets() {
  if (!(state === 'devour' && devour && devour.pellets && devour.pellets.length)) return;
  for (const pel of devour.pellets) {
    if (pel.life <= 0) continue;
    const a = Math.max(0, pel.life / (pel.max || 0.8));
    const rr = pel.r * (0.85 + 0.15 * (1 - (pel.settle || 0)));
    ctx.beginPath();
    ctx.arc(pel.x, pel.y, rr, 0, Math.PI * 2);
    ctx.fillStyle = pel.color;
    ctx.globalAlpha = a * 0.95;
    ctx.fill();
    ctx.strokeStyle = 'rgba(20,10,4,0.55)';
    ctx.lineWidth = Math.max(0.8, rr * 0.15);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawParticles() {
  for (const p of particles) {
    if(p.suck)continue; // replaced by the textured swallow, not a spray
    const a = Math.max(0, p.life / p.max);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * a, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = a * 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (const d of dust) {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * (d.eat ? .6 : 1), 0, Math.PI * 2);
    ctx.fillStyle = `rgba(70,50,28,${d.a * (d.eat ? .3 : 1)})`;
    ctx.fill();
  }
  // Swallow feedback is geometry, with no expanding rings or floating text.

}

function drawBoostGhosts() {
  for (const g of boostGhosts) {
    const u = clamp(g.life / g.max, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.18 + 0.28 * u;
    ctx.translate(g.x, g.y);
    ctx.rotate(g.heading);
    ctx.beginPath();
    ctx.ellipse(0, 0, g.r * 1.05, g.r * (0.75 + 0.15 * u), 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(90,60,30,0.55)';
    ctx.fill();
    ctx.strokeStyle = `rgba(210,170,100,${0.35 * u})`;
    ctx.lineWidth = 2;
    ctx.stroke();
    // speed streaks
    ctx.strokeStyle = `rgba(200,160,90,${0.4 * u})`;
    ctx.lineWidth = 2.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-g.r * 0.2, -g.r * 0.35);
    ctx.lineTo(-g.r * 1.8, -g.r * 0.2);
    ctx.moveTo(-g.r * 0.2, g.r * 0.35);
    ctx.lineTo(-g.r * 1.8, g.r * 0.2);
    ctx.moveTo(-g.r * 0.1, 0);
    ctx.lineTo(-g.r * 2.2, 0);
    ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;
}

function drawBoostFlash() {
  drawBoostGhosts();
  if (player.boostT <= 0) return;
  const a = clamp(player.boostT / BOOST_DUR, 0, 1);
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.heading);
  // wide dirt wake
  const grd = ctx.createLinearGradient(-player.r * 0.2, 0, -player.r * 3.2, 0);
  grd.addColorStop(0, `rgba(180,140,70,${0.55 * a})`);
  grd.addColorStop(0.45, `rgba(120,85,40,${0.28 * a})`);
  grd.addColorStop(1, 'rgba(80,55,25,0)');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.moveTo(-player.r * 0.15, -player.r * 0.55);
  ctx.lineTo(-player.r * 3.0, -player.r * 0.95);
  ctx.lineTo(-player.r * 3.0, player.r * 0.95);
  ctx.lineTo(-player.r * 0.15, player.r * 0.55);
  ctx.closePath();
  ctx.fill();
  // bright core streaks
  ctx.strokeStyle = `rgba(235,200,110,${0.75 * a})`;
  ctx.lineWidth = Math.max(3, player.r * 0.12);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-player.r * 0.2, 0);
  ctx.lineTo(-player.r * 2.4, 0);
  ctx.stroke();
  ctx.strokeStyle = `rgba(40,28,14,${0.45 * a})`;
  ctx.lineWidth = Math.max(2, player.r * 0.06);
  ctx.beginPath();
  ctx.moveTo(-player.r * 0.15, -player.r * 0.35);
  ctx.lineTo(-player.r * 2.0, -player.r * 0.55);
  ctx.moveTo(-player.r * 0.15, player.r * 0.35);
  ctx.lineTo(-player.r * 2.0, player.r * 0.55);
  ctx.stroke();
  // nose wind ring
  ctx.beginPath();
  ctx.ellipse(player.r * 0.15, 0, player.r * 0.35, player.r * 0.55, 0, 0, Math.PI * 2);
  ctx.strokeStyle = `rgba(230,200,120,${0.35 * a})`;
  ctx.lineWidth = 2;
  ctx.stroke();
  ctx.restore();
}

function drawFeastMandibles(hx, hy, ang, jaw, scale) {
  // enlarged ~2× for close-up: open/close must read at cam.z~3.35
  const open = jaw * (18 + scale * 0.55);
  const len = 16 + scale * 0.55;
  const base = 8 + scale * 0.2;
  ctx.save();
  ctx.translate(hx, hy);
  ctx.rotate(ang + Math.PI / 2);
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * (3.5 + open * 0.15), 3);
    ctx.lineTo(side * (base + open), -len * 0.35);
    ctx.lineTo(side * (2 + open * 0.4), -len);
    ctx.lineTo(side * 0.6, -len * 0.55);
    ctx.closePath();
    const g = ctx.createLinearGradient(0, 3, 0, -len);
    g.addColorStop(0, '#3a2814');
    g.addColorStop(0.5, '#2a1c10');
    g.addColorStop(1, '#1a1008');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = 'rgba(10,6,2,0.8)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
  // mouth cavity when open
  if (jaw > 0.12) {
    ctx.beginPath();
    ctx.ellipse(0, -3 - jaw * 3, 5.5 + jaw * 4, 3.5 + jaw * 5.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(12,6,2,${0.4 + jaw * 0.5})`;
    ctx.fill();
  }
  ctx.restore();
}

function drawFeastChunk(b) {
  const a = clamp(b.life / b.max, 0, 1);
  const r = b.r;
  const seedN = (b.seed != null ? b.seed : (player && player.seed) || 1) | 0;
  const picked = pickDungAtlas(seedN, Math.max(r, 12));

  ctx.save();
  ctx.globalAlpha = 0.65 + 0.35 * a;

  // soft ground shadow
  ctx.beginPath();
  ctx.ellipse(b.x + r * 0.05, b.y + r * 0.75, r * 0.9, r * 0.28, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.fill();

  if (picked) {
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot || b.roll || 0);
    const tw = r * 2.2;
    ctx.drawImage(picked.atlas, -tw / 2, -tw / 2, tw, tw);
    ctx.restore();

    // matte lighting (unrotated)
    ctx.save();
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.clip();
    const hx = b.x - r * 0.28, hy = b.y - r * 0.34;
    const shade = ctx.createRadialGradient(hx, hy, r * 0.05, b.x + r * 0.15, b.y + r * 0.2, r);
    shade.addColorStop(0, 'rgba(255,242,210,0.18)');
    shade.addColorStop(0.45, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.38)');
    ctx.fillStyle = shade;
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  } else {
    const hx = b.x - r * 0.35, hy = b.y - r * 0.40;
    const grd = ctx.createRadialGradient(hx, hy, r * 0.08, b.x + r * 0.12, b.y + r * 0.18, r);
    grd.addColorStop(0, '#a87840');
    grd.addColorStop(0.35, '#6a4420');
    grd.addColorStop(0.7, '#3a2410');
    grd.addColorStop(1, '#1a1008');
    ctx.beginPath();
    ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
    ctx.fillStyle = grd;
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(b.x, b.y, r, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(230,200,140,0.55)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
  ctx.restore();
}

function drawFeastCloseup() {
  if (!feast) return;
  const ang = feast.contactAng;
  const br = Math.max(feast.ballR || 0, 0.5);
  const mush = feast.mush || 0;
  const jaw = feast.jaw || 0;

  // fake cinematic ball — never rely on tiny leftover player.r art path alone
  const feastBall = {
    x: player.x,
    y: player.y,
    r: br,
    roll: player.roll || 0,
    seed: player.seed || 1,
    squeeze: player.squeeze || 0,
    stretch: player.stretch || 1,
    squash: player.squash || 1,
  };

  // --- ball first (scalloped bites toward beetle) ---
  if (br > 0.8) {
    ctx.save();
    if (feast.biteScallops && feast.biteScallops.length) {
      ctx.beginPath();
      ctx.arc(feastBall.x, feastBall.y, br, 0, Math.PI * 2);
      for (const s of feast.biteScallops) {
        const sx = feastBall.x + Math.cos(s.ang) * (br - s.depth * 0.15);
        const sy = feastBall.y + Math.sin(s.ang) * (br - s.depth * 0.15);
        ctx.moveTo(sx + s.depth, sy);
        ctx.arc(sx, sy, s.depth * 1.15, 0, Math.PI * 2, true);
      }
      ctx.clip();
    }
    // brighter LOD2 dung fill (temp swap player.r so rim/player branch can apply)
    const prevR = player.r;
    player.r = br;
    drawDungBall(player, 2);
    player.r = prevR;
    // extra brightening wash so ball reads vs dirt
    ctx.beginPath();
    ctx.arc(feastBall.x, feastBall.y, br * 0.92, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(160,120,60,0.14)';
    ctx.fill();
    ctx.restore();
    // strong rim outline against dirt
    ctx.beginPath();
    ctx.arc(feastBall.x, feastBall.y, br, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(230,200,140,0.85)';
    ctx.lineWidth = 3.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(feastBall.x, feastBall.y, br * 1.04, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(200,165,90,0.4)';
    ctx.lineWidth = 2.2;
    ctx.stroke();
    for (const s of (feast.biteScallops || [])) {
      const sx = feastBall.x + Math.cos(s.ang) * (br * 0.92);
      const sy = feastBall.y + Math.sin(s.ang) * (br * 0.92);
      ctx.beginPath();
      ctx.arc(sx, sy, s.depth * 0.95, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(18,10,4,0.55)';
      ctx.fill();
    }
  }

  // --- one large beetle ABOVE ball; local art ~40 tall → sc = beetleH/40 ---
  const beetleH = br * 2.15 * lerp(1, 0.88, mush);
  const sc = Math.max(1.8, beetleH / 40);
  // head (~local y=-15) touches top of ball
  const bodyDist = br + 15 * sc;
  const bx = feastBall.x + Math.cos(ang) * bodyDist;
  const by = feastBall.y + Math.sin(ang) * bodyDist;
  // local -Y points toward ball (head into contact)
  const rot = ang - Math.PI / 2;

  ctx.save();
  ctx.translate(bx, by);
  ctx.rotate(rot);
  ctx.scale(sc, sc * (1 - jaw * 0.05));

  // ground shadow
  ctx.beginPath();
  ctx.ellipse(0, 14, 13, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fill();

  // legs (simple braced)
  ctx.strokeStyle = '#1a140c';
  ctx.lineWidth = 2.8;
  ctx.lineCap = 'round';
  for (const side of [-1, 1]) {
    ctx.beginPath();
    ctx.moveTo(side * 6, -2);
    ctx.lineTo(side * 14, -10 - jaw * 2);
    ctx.moveTo(side * 7, 5);
    ctx.lineTo(side * 16, 10);
    ctx.moveTo(side * 6, 12);
    ctx.lineTo(side * 14, 18);
    ctx.stroke();
  }

  // abdomen / elytra
  const ely = ctx.createLinearGradient(-10, 0, 12, 18);
  ely.addColorStop(0, '#3a4a28');
  ely.addColorStop(0.35, '#243018');
  ely.addColorStop(0.7, '#141a0c');
  ely.addColorStop(1, '#0a0c06');
  ctx.beginPath();
  ctx.ellipse(0, 8, 11, 14, 0, 0, Math.PI * 2);
  ctx.fillStyle = ely;
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(0, 20);
  ctx.strokeStyle = 'rgba(0,0,0,0.5)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // thorax
  ctx.beginPath();
  ctx.ellipse(0, -7, 8, 6.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#1a2214';
  ctx.fill();

  // head
  ctx.beginPath();
  ctx.ellipse(0, -15, 5.5, 4.5, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#12180c';
  ctx.fill();

  // horns
  ctx.strokeStyle = '#0a0804';
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-3.5, -17);
  ctx.quadraticCurveTo(-9, -22, -6.5, -26);
  ctx.moveTo(3.5, -17);
  ctx.quadraticCurveTo(9, -22, 6.5, -26);
  ctx.moveTo(0, -17);
  ctx.lineTo(0, -24);
  ctx.stroke();

  // eyes
  ctx.fillStyle = '#1a0804';
  ctx.beginPath(); ctx.ellipse(-3.2, -15, 1.7, 1.3, 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(3.2, -15, 1.7, 1.3, -0.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = 'rgba(200,180,100,0.35)';
  ctx.beginPath(); ctx.arc(-3.5, -15.3, 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(2.9, -15.3, 0.45, 0, Math.PI * 2); ctx.fill();

  ctx.restore();

  // big mandibles at mouth (scale ~2× prior relative size)
  const mouth = feastMouthPos();
  const hx = mouth.x - Math.cos(ang) * (2 + jaw * 2);
  const hy = mouth.y - Math.sin(ang) * (2 + jaw * 2);
  drawFeastMandibles(hx, hy, ang + Math.PI, jaw, Math.max(36, br * 0.85));

  // flying chunks on top
  for (const b of feast.bites) drawFeastChunk(b);
}

function draw() {
  if(state==='devour'||(state==='dead'&&presentation.kind==='death')){drawDeathComedy();return;}
  if(state==='feast'){drawVictoryComedy();return;}
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, vw, vh);
  ctx.fillStyle = '#2a2218';
  ctx.fillRect(0, 0, vw, vh);

  worldTransform();
  drawBackground();

  const scaleView = viewScale();
  const halfW = (vw / scaleView) * 0.55 + 90;
  const halfH = (vh / scaleView) * 0.55 + 90;
  const minX = cam.x - halfW, maxX = cam.x + halfW;
  const minY = cam.y - halfH, maxY = cam.y + halfH;

  const drawList = [];
  const devourPred = (state === 'devour' && devour) ? devour.predator : null;
  for (const b of balls) {
    if (b.x + b.r < minX || b.x - b.r > maxX || b.y + b.r < minY || b.y - b.r > maxY) continue;
    // during devour, draw predator after player so player ball goes under/into belly
    let z = b.y + b.r;
    if (devourPred && b === devourPred) z = 1e9;
    drawList.push({ z, kind: 'ball', ref: b });
  }
  const hideDevourPlayer = state === 'devour' && devour && (devour.hidePlayer || player.hideBall || player.r < 0.5);
  if (!hideDevourPlayer) {
    // player under predator: slightly lower z than predator's forced top
    const pz = devourPred ? (1e9 - 1) : (player.y + player.r);
    drawList.push({ z: pz, kind: 'player', ref: player });
  }
  drawList.sort((a, b) => a.z - b.z);

  for (const item of drawList) {
    if (item.kind === 'player') {
      if (state === 'feast' && feast) {
        drawFeastCloseup();
      } else if (state === 'devour' && devour) {
        const style = devour.style || 'agar';
        const u = clamp(devour.t / devour.dur, 0, 1);
        const showP = player.r > 0.8 && !devour.hidePlayer && !player.hideBall;
        if (showP) {
          ctx.save();
          // Bright outline so protagonist stays readable during long death
          const pulse = devour.outlinePulse || 0.7;
          ctx.beginPath();
          ctx.arc(player.x, player.y, player.r * 1.12, 0, Math.PI * 2);
          ctx.strokeStyle = style === 'hole'
            ? `rgba(255,210,120,${0.35 + pulse * 0.35})`
            : `rgba(255,240,200,${0.45 + pulse * 0.4})`;
          ctx.lineWidth = Math.max(2.5, player.r * 0.12);
          ctx.stroke();
          if (style === 'hole') {
            const tint = clamp(player.deathTint || u, 0, 1);
            drawDungBall(player, 2);
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.r * 1.02, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0,0,0,${0.12 + tint * 0.78})`;
            ctx.fill();
            // Keep face readable until late darken
            if (tint < 0.85) {
              ctx.globalAlpha = 1 - tint * 0.7;
              drawBeetle(
                player.x, player.y,
                Math.max(12, player.r * 0.9 + 5),
                player.beetleAng,
                1, 1, false
              );
              ctx.globalAlpha = 1;
            }
          } else {
            // agar hold / slither hold — full clear beetle + ball
            drawBeetle(
              player.x, player.y,
              Math.max(12, player.r * 0.9 + 5),
              player.beetleAng,
              1, 1, false
            );
            drawDungBall(player, 2);
          }
          ctx.restore();
        }
        // slither pellets drawn via drawDeathPellets after ball pass
      } else {
        drawBeetle(player.x, player.y, player.r, player.beetleAng, player.pushEffort, player.squeeze, false);
        drawEatRemnants();
        drawPlayerEatBody();
        drawEatContact();
        drawBoostFlash();
      }
    } else {
      const b = item.ref;
      if (b.r >= 11) drawBeetle(b.x, b.y, b.r, b.beetleAng || Math.PI / 2, b.pushEffort || 0.3, b.squeeze || 0.3, true);
      drawDungBall(b, b.r >= 36 ? 1 : 0);
    }
  }

  drawParticles();
  drawDeathPellets();

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (state === 'feast' && feast) {
    // soft neutral vignette — center clear, edges dim
    const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.18, vw / 2, vh / 2, Math.max(vw, vh) * 0.72);
    vg.addColorStop(0, 'rgba(0,0,0,0.04)');
    vg.addColorStop(0.55, 'rgba(20,14,8,0.22)');
    vg.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, vw, vh);
    // single stable title
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '800 26px sans-serif';
    ctx.strokeStyle = 'rgba(0,0,0,0.65)';
    ctx.lineWidth = 5;
    ctx.strokeText('开吃', vw / 2, vh * 0.22);
    ctx.fillStyle = '#e8d4a0';
    ctx.fillText('开吃', vw / 2, vh * 0.22);
    ctx.restore();
  }

  // slither death pellets (world-space — redraw under UI after particles already drawn in world)
  // (pellets are drawn in world pass below via drawDeathPellets called before setTransform reset)

  if (state === 'devour' && devour) {
    // Calm formal fail wash: soft desaturate + dark vignette (no zoom letterbox, no flash spam)
    const wash = clamp(devour.failWash != null ? devour.failWash : (devour.t / Math.max(0.01, devour.dur)), 0, 1);
    const vgA = clamp(devour.vignette || wash, 0, 1);
    ctx.save();
    ctx.globalCompositeOperation = 'saturation';
    ctx.fillStyle = `rgba(0,0,0,${0.12 + wash * 0.62})`;
    ctx.fillRect(0, 0, vw, vh);
    ctx.restore();
    // mild cool darken over center so pellets stay readable
    ctx.fillStyle = `rgba(6,5,4,${0.04 + wash * 0.18})`;
    ctx.fillRect(0, 0, vw, vh);
    const vg = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * 0.18, vw / 2, vh / 2, Math.max(vw, vh) * 0.78);
    vg.addColorStop(0, `rgba(0,0,0,${0.02 + vgA * 0.06})`);
    vg.addColorStop(0.55, `rgba(10,8,6,${0.08 + vgA * 0.2})`);
    vg.addColorStop(1, `rgba(0,0,0,${0.32 + vgA * 0.42})`);
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, vw, vh);
  }

  if (state === 'play') {
    if (player.boostT > 0) {
      const a = clamp(player.boostT / BOOST_DUR, 0, 1);
      ctx.save();
      ctx.translate(vw * 0.5, vh * 0.58);
      ctx.rotate(player.heading);
      ctx.strokeStyle = `rgba(230,190,100,${0.18 * a})`;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (let i = -4; i <= 4; i++) {
        if (i === 0) continue;
        const yy = i * 16;
        const len = 40 + (Math.abs(i) % 3) * 28;
        ctx.globalAlpha = (0.25 + 0.55 * a) * (1 - Math.abs(i) / 6);
        ctx.beginPath();
        ctx.moveTo(-30 - len, yy);
        ctx.lineTo(-30, yy * 0.6);
        ctx.stroke();
      }
      ctx.restore();
      ctx.globalAlpha = 1;
    }
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillStyle = player.boostT > 0 ? 'rgba(236,200,110,0.9)' : (player.boostCD > 0 ? 'rgba(160,140,110,0.3)' : 'rgba(200,180,140,0.55)');
    const label = player.boostT > 0 ? '加速中' : (player.boostCD > 0 ? '加速冷却' : '加速就绪');
    ctx.fillText(label, vw - 14, vh - 48);
  }
}

// Render-only swallow snapshots: never placed in balls, never involved in collisions.
const eatVisuals=[];
function queueEatVisual(b){
  const dx=b.x-player.x,dy=b.y-player.y;
  const ratio=clamp(b.r/Math.max(1,player.r),.15,1.05);
  eatVisuals.push({ball:{...b},dx,dy,angle:Math.atan2(dy,dx),t:0,duration:.28+ratio*.1,ratio});
  if(eatVisuals.length>8)eatVisuals.shift();
}
function updateEatVisuals(dt){
  if(state!=='play')return;
  for(const v of eatVisuals)v.t+=dt;
  for(let i=eatVisuals.length-1;i>=0;i--)if(eatVisuals[i].t>.66)eatVisuals.splice(i,1);
}
function drawEatRemnants(){
  for(const v of eatVisuals){
    const u=clamp(v.t/v.duration,0,1);if(u>=1)continue;
    // A readable contact squeeze, followed by a quick pull under the eater's edge.
    const pull=easeInCubic(u),pinch=Math.sin(u*Math.PI);
    const rr=v.ball.r*(1-pull*.9);
    const x=player.x+v.dx*(1-pull),y=player.y+v.dy*(1-pull);
    ctx.save();ctx.translate(x,y);ctx.rotate(v.angle);
    drawDungBall({...v.ball,x:0,y:0,r:rr,roll:(v.ball.roll||0)-v.angle,
      stretch:1+pinch*.3,squash:1-pinch*.38,squeeze:0},v.ball.r>=26?1:0);
    ctx.restore();
  }
}
function drawPlayerEatBody(){
  if(!eatVisuals.length){drawDungBall(player,2);return;}
  const v=eatVisuals[eatVisuals.length-1],t=v.t;
  const press=-.09*Math.sin(clamp(t/.18,0,1)*Math.PI);
  const settle=t<.16?0:Math.sin((t-.16)*23)*Math.exp(-(t-.16)*9)*.12;
  const amount=(press+settle)*(.65+v.ratio*.35);
  const sq=player.squeeze||0;
  const oldX=(player.stretch||1)*(1+sq*.06),oldY=(player.squash||1)*(1-sq*.08);
  ctx.save();ctx.translate(player.x,player.y);ctx.rotate(v.angle);
  ctx.scale(1+amount,1/(1+amount));ctx.rotate(-v.angle);
  ctx.scale(1/oldX,1/oldY);ctx.translate(-player.x,-player.y);
  drawDungBall(player,2);ctx.restore();
}
function drawEatContact(){
  for(const v of eatVisuals){
    const u=clamp(v.t/v.duration,0,1);if(u<=0||u>=1)continue;
    // Tiny crumbs disappear into the contact edge. No flash, text or target markers.
    const q=Math.sin(u*Math.PI),edge=player.r*(1-u*.18);
    ctx.save();ctx.translate(player.x,player.y);ctx.rotate(v.angle);
    ctx.lineCap='round';ctx.lineWidth=Math.max(1,player.r*.035);
    ctx.strokeStyle=`rgba(44,28,14,${q*.55})`;ctx.beginPath();
    ctx.arc(0,0,edge,-.20*q,.20*q);ctx.stroke();
    for(let i=0;i<3;i++){
      const drift=(i-1)*v.ball.r*.25*(1-u);
      ctx.fillStyle=`rgba(${i%2?'114,78,40':'73,47,24'},${q*.8})`;
      ctx.beginPath();ctx.arc(edge+q*v.ball.r*.15,drift,Math.max(1,Math.min(3,v.ball.r*.1))*(1-u*.6),0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  }
}

// Presentation only. None of these functions run the simulation or change a live round.
const presentation = {t:0,kind:null,from:null,pred:null,bites:0,sound:true,reduced:matchMedia('(prefers-reduced-motion: reduce)').matches};
const sceneFrame=document.getElementById('frame');
const soundButton=document.getElementById('sound-btn');
function resetPresentation(){
  presentation.kind=null;presentation.t=0;presentation.bites=0;
  eatVisuals.length=0;
  sceneFrame.classList.remove('ending','animating','death-scene');
}
function beginPresentation(kind,pred){
  presentation.kind=kind;presentation.t=0;presentation.bites=0;
  presentation.from={...player};
  presentation.pred=pred?{...pred}:null;
  presentation.predRef=pred||null;
  presentation.camera={...cam};
  presentation.stats={kills,total:totalSpawned,seconds:Math.round(time),radius:Math.round(player.r)};
  sceneFrame.classList.add('animating');
  sceneFrame.classList.toggle('ending',kind==='win');
  sceneFrame.classList.toggle('death-scene',kind==='death');
  elToast.classList.remove('show');toastT=0;
}
function endTone(freq,end,duration=.15,type='triangle',volume=.08,delay=0){
  if(!presentation.sound)return;
  const ac=ensureAudio();if(!ac)return;
  const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,end),t+duration);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+duration);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+duration+.03);
}
function updateComedyDeath(dt){
  if(!devour)return;
  const previous=devour.t;devour.t+=dt;presentation.t=devour.t;
  if(previous<.20&&devour.t>=.20){endTone(210,760,.12,'sine',.11);endTone(95,45,.12,'triangle',.13);}
  if(previous<.76&&devour.t>=.76)landingSound();
  if(previous<.98&&devour.t>=.98)endTone(190,65,.10,'triangle',.07);
  if(previous<1.18&&devour.t>=1.18)endTone(460,280,.17,'sine',.04);
  if(devour.t>=2.35)finishDeathCinematic();
}
function updateComedyWin(dt){
  if(!feast)return;
  const previous=feast.t;feast.t+=dt;presentation.t=feast.t;
  for(let i=0;i<4;i++){
    const at=.62+i*.43;
    if(previous<at&&feast.t>=at){presentation.bites++;playEatSFX(24,65);endTone(220+i*48,140+i*28,.1,'triangle',.06);}
  }
  if(previous<2.65&&feast.t>=2.65){endTone(105,42,.32,'sawtooth',.055);endTone(250,170,.19,'sine',.04,.08);}
  if(previous<3.05&&feast.t>=3.05)[262,330,392,523].forEach((f,i)=>endTone(f,f,.17,'triangle',.07,i*.07));
  if(feast.t>=3.8)finishFeast();
}
function fillResult(id,won){
  sceneFrame.classList.remove('animating');
  const st=presentation.stats||{kills,total:totalSpawned,seconds:Math.round(time)};
  const pct=st.total?Math.floor(st.kills/st.total*100):0;
  document.getElementById(id).innerHTML=`<div><b>${st.kills}<small> / ${st.total}</small></b>吞掉的球</div><div><b>${won?'100':pct}<small>%</small></b>清场进度</div>`;
}
function paperText(text,x,y,size,color='#ffefb3',rotation=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`950 ${size}px "Microsoft YaHei",sans-serif`;
  ctx.lineJoin='round';ctx.lineWidth=Math.max(3,size*.11);ctx.strokeStyle='#51381e';ctx.strokeText(text,0,0);ctx.fillStyle=color;ctx.fillText(text,0,0);ctx.restore();
}
function drawCineBall(x,y,r,seed,roll,sx=1,sy=1){
  if(r<.4)return;
  // Original textured ball renderer: no facial features, in any state.
  drawDungBall({x,y,r,seed,roll,squash:sy,stretch:sx,squeeze:0},2);
}
function drawCineBeetle(x,y,angle,size,effort=.8,belly=1,flail=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.scale(size*belly,size);
  // Re-center the original insect renderer on its carapace. The ball is drawn separately.
  const pr=18,sq=.3,dist=pr+20-(sq*.55+effort*.35)*9+(1-effort)*4;
  drawBeetle(0,dist,pr,-Math.PI/2,effort,sq,false,presentation.t*(flail?2:1));
  ctx.restore();
}
function cineBackdrop(){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#292b18';ctx.fillRect(0,0,vw,vh);
  ctx.save();ctx.globalAlpha=.5;ctx.drawImage(texDirt,0,0,vw,vh);ctx.restore();
  const g=ctx.createRadialGradient(vw*.5,vh*.5,30,vw*.5,vh*.5,vh*.66);
  g.addColorStop(0,'rgba(34,37,21,0)');g.addColorStop(1,'rgba(14,20,12,.92)');ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  const c=vw/540;
  ctx.save();ctx.scale(c,c);
  return c;
}
function deathFlight(t,from,pred){
  const effort=from.pushEffort||.5,sq=from.squeeze||0,a=from.beetleAng;
  const dist=from.r+20-(sq*.55+effort*.35)*9+(1-effort)*4;
  const bx=from.x+Math.cos(a)*dist,by=from.y+Math.sin(a)*dist;
  const angle=Math.atan2(from.y-pred.y,from.x-pred.x);
  const u=clamp((t-.24)/.52,0,1),travel=1-Math.pow(1-u,2);
  const endX=clamp(bx+Math.cos(angle)*155,ARENA.x+45,ARENA.x+ARENA.w-45);
  const endY=clamp(by+Math.sin(angle)*125,ARENA.y+50,ARENA.y+ARENA.h-50);
  const land=Math.max(0,t-.76);
  const bounce=land<.44?Math.abs(Math.sin(land/.22*Math.PI))*Math.exp(-land*7)*23:0;
  return {bx,by,endX,endY,angle,u,land,
    x:lerp(bx,endX,travel),y:lerp(by,endY,travel)-(presentation.reduced?0:Math.sin(u*Math.PI)*75+bounce),
    turn:presentation.reduced?0:u*Math.PI*3.6,
    scale:1+(presentation.reduced?0:Math.sin(u*Math.PI)*.24),
    squash:land<.14?Math.sin(land/.14*Math.PI)*.52:0};
}
function drawFlungBeetle(t,from,pred,alpha=1){
  const f=deathFlight(t,from,pred),effort=from.pushEffort||.5,sq=from.squeeze||0;
  ctx.save();ctx.globalAlpha=alpha;ctx.translate(f.x,f.y);
  ctx.rotate(f.turn);ctx.scale(f.scale*(1+f.squash*.75),f.scale*(1-f.squash));ctx.translate(-f.bx,-f.by);
  drawBeetle(from.x,from.y,from.r,from.beetleAng,t>.24?1:effort,sq,false,time+Math.max(0,t-.24)*3.6);
  ctx.restore();
}
function deathBurst(x,y,angle,u,r){
  if(u<=0||u>=1)return;
  const strength=presentation.reduced?.38:1;
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  // Single contact star, then irregular earth chips. Everything is local to the collision.
  if(u<.42){
    const q=u/.42,rr=r*(.45+easeOutCubic(q)*1.4);
    ctx.globalAlpha=(1-q)*.95*strength;ctx.beginPath();
    for(let i=0;i<24;i++){
      const aa=i*Math.PI/12,dd=rr*(i%2?.30:1+(i%3)*.1);
      const x=Math.cos(aa)*dd,y=Math.sin(aa)*dd*.7;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();ctx.fillStyle='#ffe4a1';ctx.strokeStyle='#72502c';ctx.lineWidth=2;ctx.fill();ctx.stroke();
  }
  for(let i=0;i<18;i++){
    const a=i*2.399,sp=r*(1.2+(i%5)*.35),d=easeOutCubic(u)*sp;
    const x=Math.cos(a)*d,y=Math.sin(a)*d*.75+u*u*r*.6;
    ctx.save();ctx.globalAlpha=(1-u)*strength;ctx.translate(x,y);ctx.rotate(a+u*5);
    ctx.fillStyle=['#4c321c','#b48a52','#826039'][i%3];
    const s=(2+i%4)*(1-u*.45);ctx.fillRect(-s,-s*.7,s*2,s*1.4);ctx.restore();
  }
  ctx.restore();
}
function drawLandingDust(f){
  if(f.land<=0)return;
  const u=clamp(f.land/.65,0,1),reduced=presentation.reduced?.45:1;
  ctx.save();ctx.translate(f.endX,f.endY+12);
  // A flat skid mark stays under the bug; dust rolls outwards instead of hiding it.
  ctx.fillStyle='rgba(65,42,22,.25)';ctx.beginPath();ctx.ellipse(0,3,39,13,f.angle,0,Math.PI*2);ctx.fill();
  for(let i=0;i<7;i++){
    const a=i*2.399,d=16+(i%3)*7;
    ctx.strokeStyle='rgba(67,42,20,.34)';ctx.lineWidth=1.7;ctx.beginPath();
    ctx.moveTo(Math.cos(a)*14,Math.sin(a)*6);ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d*.4);ctx.stroke();
  }
  if(u<1)for(let i=0;i<14;i++){
    const a=i*2.399,spread=easeOutCubic(u)*(30+(i%5)*11);
    const x=Math.cos(a)*spread,y=Math.sin(a)*spread*.42-u*15;
    const r=(8+(i%4)*4)*(1+u*.65);
    ctx.globalAlpha=(1-u)*.40*reduced;ctx.fillStyle=i%2?'#c29b64':'#8f6e45';
    ctx.beginPath();ctx.ellipse(x,y,r,r*.7,0,0,Math.PI*2);ctx.fill();
  }
  ctx.restore();
}
function landingSound(){
  if(!presentation.sound)return;
  endTone(145,38,.2,'sine',.23);endTone(330,80,.075,'triangle',.08);
  const ac=ensureAudio();if(!ac)return;
  const t=ac.currentTime,src=ac.createBufferSource(),filter=ac.createBiquadFilter(),gain=ac.createGain();
  src.buffer=_noiseBuffer(ac,.2);filter.type='lowpass';filter.frequency.setValueAtTime(1600,t);filter.frequency.exponentialRampToValueAtTime(180,t+.2);
  gain.gain.setValueAtTime(.14,t);gain.gain.exponentialRampToValueAtTime(.001,t+.2);
  src.connect(filter);filter.connect(gain);gain.connect(ac.destination);src.start(t);src.stop(t+.21);
}
function drawDeathComedy(){
  const t=presentation.t,from=presentation.from,pred=presentation.pred;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,vw,vh);
  ctx.fillStyle='#2a2218';ctx.fillRect(0,0,vw,vh);worldTransform();drawBackground();
  const angle=Math.atan2(from.y-pred.y,from.x-pred.x);
  const squeeze=clamp(t/.20,0,1),bite=clamp((t-.20)/.20,0,1),pull=easeInCubic(bite);
  const finalR=Math.min(96,rOfVol(volOf(pred.r)+volOf(from.r)*.88));
  const grow=easeOutCubic(clamp((t-.26)/.24,0,1));
  const pulse=t>.32?Math.sin((t-.32)*26)*Math.exp(-(t-.32)*7)*.20:0;
  const contactX=pred.x+Math.cos(angle)*pred.r*.85,contactY=pred.y+Math.sin(angle)*pred.r*.85;
  for(const b of balls.filter(b=>b!==presentation.predRef).sort((a,b)=>a.y+a.r-b.y-b.r)){
    if(b.r>=11)drawBeetle(b.x,b.y,b.r,b.beetleAng||Math.PI/2,b.pushEffort||.3,b.squeeze||.3,true);
    drawDungBall(b,b.r>=36?1:0);
  }
  const f=deathFlight(t,from,pred);
  drawLandingDust(f);
  if(t>.24&&t<.76){
    ctx.save();ctx.globalAlpha=.24;ctx.fillStyle='#382817';ctx.beginPath();
    ctx.ellipse(f.x,lerp(f.by,f.endY,easeOutCubic(f.u))+14,24*(1-f.u*.25),7,0,0,Math.PI*2);ctx.fill();ctx.restore();
  }
  if(bite<1){
    ctx.save();ctx.translate(lerp(from.x,pred.x,pull),lerp(from.y,pred.y,pull));ctx.rotate(angle);
    drawDungBall({...from,x:0,y:0,r:from.r*(1-pull*.95),roll:(from.roll||0)-angle,
      stretch:1-squeeze*.48,squash:1+squeeze*.5,squeeze:0},2);ctx.restore();
  }
  if(pred.r>=11)drawBeetle(pred.x,pred.y,pred.r,pred.beetleAng||Math.PI/2,pred.pushEffort||.3,pred.squeeze||.3,true);
  drawDungBall({...pred,r:lerp(pred.r,finalR,grow),stretch:1+pulse,squash:1-pulse,squeeze:0},pred.r>=36?1:0);
  deathBurst(contactX,contactY,angle,clamp((t-.20)/.48,0,1),Math.max(34,from.r*1.35));
  if(!presentation.reduced&&t>.28&&t<.77){
    drawFlungBeetle(t-.09,from,pred,.10);drawFlungBeetle(t-.045,from,pred,.21);
  }
  drawFlungBeetle(t,from,pred);
  if(f.land>0&&f.land<.18){
    const u=f.land/.18;ctx.save();ctx.globalAlpha=(1-u)*.7;
    ctx.strokeStyle='#e1bb7a';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(f.endX,f.endY+12,20+u*45,5+u*12,0,0,Math.PI*2);ctx.stroke();ctx.restore();
  }
  if(t>1.02){
    // Dizzy stars belong to the beetle, never to the dung balls.
    const appear=clamp((t-1.02)/.2,0,1);
    for(let i=0;i<3;i++){
      const a=t*4.5+i*Math.PI*2/3,x=f.endX+Math.cos(a)*31,y=f.endY-31+Math.sin(a)*10;
      ctx.save();ctx.translate(x,y);ctx.rotate(a*.3);ctx.globalAlpha=appear*.85;
      ctx.beginPath();for(let j=0;j<10;j++){const aa=j*Math.PI/5,rr=j%2?2.5:6;const px=Math.cos(aa)*rr,py=Math.sin(aa)*rr;if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}
      ctx.closePath();ctx.fillStyle='#ffe49a';ctx.strokeStyle='#87602d';ctx.lineWidth=1;ctx.fill();ctx.stroke();ctx.restore();
    }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
}

function drawCrown(x,y,angle=0){
  ctx.save();ctx.translate(x,y);ctx.rotate(angle);
  ctx.beginPath();ctx.moveTo(-29,10);ctx.lineTo(-34,-20);ctx.lineTo(-13,-7);ctx.lineTo(0,-32);ctx.lineTo(13,-7);ctx.lineTo(34,-20);ctx.lineTo(29,10);ctx.closePath();
  ctx.fillStyle='#ead06f';ctx.strokeStyle='#71501f';ctx.lineWidth=3;ctx.fill();ctx.stroke();
  ctx.fillStyle='#839b4a';ctx.beginPath();ctx.arc(0,-3,5,0,Math.PI*2);ctx.fill();ctx.restore();
}
function drawVictoryComedy(){
  const t=presentation.t,c=cineBackdrop(),height=vh/c,cy=height*.57;
  const bites=presentation.bites,phase=clamp((t-.62-(Math.max(0,bites-1))*.43)/.18,0,1);
  const gulp=clamp((t-2.22)/.35,0,1);
  const r=(96-bites*15)*(1-easeInCubic(gulp));
  const chomp=t>.62&&t<2.2?Math.sin(phase*Math.PI):0;
  const bugY=cy-122+chomp*17;
  // Warm spotlight, no camera shake or spinning frame.
  ctx.save();ctx.globalAlpha=.1;ctx.fillStyle='#f5d781';ctx.beginPath();ctx.moveTo(270,120);ctx.lineTo(445,cy+130);ctx.lineTo(95,cy+130);ctx.fill();ctx.restore();
  drawCineBall(270,cy,Math.max(.1,r),player.seed,t*.5,1+chomp*.1,1-chomp*.15);
  const belly=1+gulp*.45;
  const burp=t>2.65?Math.sin(clamp((t-2.65)/.32,0,1)*Math.PI)*12:0;
  drawCineBeetle(270+Math.sin(t*12)*chomp*2,bugY-burp,Math.PI+(t>2.8?Math.sin((t-2.8)*4)*.09:0),2.3,Math.max(.3,1-gulp*.6),belly);
  // A few crumbs visibly arc from the rim into the insect's mouth on each bite.
  if(bites>0&&t<2.45){
    const u=clamp((t-(.62+(bites-1)*.43))/.32,0,1);
    for(let i=0;i<5;i++){
      const x=270+(i-2)*7*Math.sin(u*Math.PI),y=lerp(cy-Math.max(24,r),bugY+62,u)-Math.sin(u*Math.PI)*12;
      ctx.fillStyle=['#4c3119','#997040','#795326'][i%3];ctx.beginPath();ctx.arc(x,y,(6-i*.6)*(1-u*.6),0,Math.PI*2);ctx.fill();
    }
  }
  if(t<.5)paperText('这回轮到我开饭了',270,height*.23,32);
  else if(t<2.22)paperText('啊呜！',270,height*.23,49,'#ffedac',-.045);
  else if(t<2.65)paperText('最后一口也不能浪费',270,height*.23,27);
  else{
    paperText('嗝——',270,height*.23,47,'#f2edaa',.035);
    paperText('吃撑了。真吃撑了。',270,cy+130,21,'#d9d9ad');
  }
  if(t>=3.05){
    const drop=clamp((t-3.05)/.34,0,1),s=1-Math.pow(1-drop,3);
    drawCrown(270,lerp(height*.28,bugY-56,s),Math.sin(drop*Math.PI)*.12);
    if(!presentation.reduced)for(let i=0;i<25;i++){
      const u=clamp((t-3.05)/.8,0,1),x=270+Math.sin(i*8.1)*(70+u*210),y=bugY-90+u*(130+(i%4)*30)-Math.sin(u*Math.PI)*80;
      ctx.save();ctx.translate(x,y);ctx.rotate(i+u*6);ctx.fillStyle=['#e9d073','#b5d26e','#e9e2b4'][i%3];ctx.fillRect(-3,-5,6,10);ctx.restore();
    }
  }
  ctx.restore();
}

let last = performance.now();
function frame(now) {
  let dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  // RECORDING ONLY: __timeScale defaults to 1 (normal speed)
  const ts = (typeof window.__timeScale === 'number' && window.__timeScale > 0) ? window.__timeScale : 1;
  dt *= ts;
  updateEatVisuals(dt);
  if (dt > 0.024) { const sdt = dt * 0.5; update(sdt); update(sdt); }
  else update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* __BALL3D_SHOT_HOOK__ */
(function () {
  if (!/[?&]ball3dshot=1\b/.test(location.search)) return;
  const arm = () => {
    try { startPlay(); } catch (e) { console.error(e); }
    // park a readable cluster in view
    try {
      player.r = Math.max(player.r, 42);
      player.x = W * 0.42;
      player.y = H * 0.40;
      player.invuln = 99;
      // grow a few nearby NPCs for LOD variety
      let i = 0;
      for (const b of balls) {
        if (b === player) continue;
        b.x = player.x + 90 + (i % 3) * 70;
        b.y = player.y - 40 + Math.floor(i / 3) * 80;
        b.r = [38, 26, 18, 48, 14, 32][i % 6];
        i++;
        if (i >= 6) break;
      }
    } catch (e) {}
    let n = 0;
    const tick = () => {
      n++;
      if (n < 12) { requestAnimationFrame(tick); return; }
      window.__ball3dReady = true;
      document.title = 'BALL3D_READY';
      const hint = document.createElement('div');
      hint.id = 'ball3dReadyFlag';
      hint.textContent = 'READY';
      hint.style.cssText = 'position:fixed;left:0;top:0;opacity:0.01;z-index:99999';
      document.body.appendChild(hint);
    };
    requestAnimationFrame(tick);
  };
  setTimeout(arm, 250);
})();

// DEMO helpers for death cinematic A/B (agar | hole | slither)
// Win-take helpers: __timeScale / __clearAssist / __autoWinBot / __winTakePending / __startWinTake (defaults off; die→bounce only when __clearAssist)
window.__forceDevour = function () {
  if (state !== 'play') {
    console.warn('__forceDevour: start a run first (state must be play)');
    return false;
  }
  let best = null, bestD = Infinity;
  const pr = player.r;
  for (const b of balls) {
    if (b.r <= pr * 1.04) continue;
    const d = Math.hypot(b.x - player.x, b.y - player.y);
    if (d < bestD) { bestD = d; best = b; }
  }
  if (!best) {
    const ang = player.heading + Math.PI;
    const r = Math.max(pr * 1.35 + 6, 28);
    const x = clamp(player.x + Math.cos(ang) * (pr + r + 8), ARENA.x + r + 10, ARENA.x + ARENA.w - r - 10);
    const y = clamp(player.y + Math.sin(ang) * (pr + r + 8), ARENA.y + r + 10, ARENA.y + ARENA.h - r - 10);
    best = makeBall(x, y, r, 'ai');
    best.tier = 'threat';
    best.vx = 0; best.vy = 0;
    balls.push(best);
  }
  startDeathCinematic(best, '眼没看清，撞上大家伙了。');
  return true;
};
window.__forceDeath = function (style) {
  if (style === 'agar' || style === 'hole' || style === 'slither') {
    window.__deathStyle = style;
  }
  return window.__forceDevour();
};
